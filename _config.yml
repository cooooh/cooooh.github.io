# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Snowtrace
subtitle: '人生到处知何似，应似飞鸿踏雪泥。'
description: '记录所学、所做、所感：计算机学习笔记、项目实践与生活随想。'
keywords: 'Snowtrace,Ykcht,博客,学习笔记,项目,生活'
author: Ykcht
language: zh-CN
timezone: 'Asia/Shanghai'

# URL — 部署到 GitHub Pages 后改成你的实际地址（如 https://用户名.github.io）
url: https://cooooh.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# Syntax highlighting
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 随笔
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator:
  enable: true
  priority: -1

# Date / Time format
## Hexo uses Moment.js to parse and display date
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude files
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Search (hexo-generator-searchdb)
search:
  path: search.xml
  field: post
  content: true
  format: html

# Deployment
## 使用 GitHub Actions 自动部署，无需在这里配置 deploy
deploy:
  type: ''
